
name: SonarQube and Trivy Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: SonarQube and Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=node-js-app
            -Dsonar.projectName="Node.js App"
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,**/.git/**,kubectl
            -Dsonar.javascript.node.maxspace=1024

      - name: Build Docker image
        run: docker build -t node-js-app:${{ github.sha }} .

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: node-js-app:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'
